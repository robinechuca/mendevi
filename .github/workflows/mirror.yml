name: Mirror from GitLab Inria

on:
  schedule:
    - cron: "0 4 * * *"  # every day at 04:00 UTC
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitLab to GitHub
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone --mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.inria.fr/rrichard/mendevi.git" mendevi.git
          cd mendevi.git
          # create a commit to merge the github README and the main README
          git worktree add ../work "$(git symbolic-ref --short HEAD)"
          (echo; cat ../work/README.rst) >> ../work/.github/README.rst
          git -C ../work -c user.name=mirror -c user.email=mirror@localhost commit -qam "Mirror: append README to GitHub notice"
          git push --mirror "https://x-access-token:${GH_TOKEN}@github.com/robinechuca/mendevi.git"
