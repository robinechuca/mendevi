# See https://docs.readthedocs.io/en/stable/config-file/v2.html
# and https://docs.readthedocs.com/platform/stable/build-customization.html for details

version: 2

build:
  os: "ubuntu-26.04"  # "ubuntu-lts-latest"
  tools:
    python: "3.14"  # "latest" (3.15 not yet available on 29/10/26)
  apt_packages:
    - graphviz  # to compile images
    - pandoc  # for nbsphinx
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - uv pip sync docs/requirements.txt
    post_install:  # solve torch cuda .so link
      - uv pip install -e .
    build:  # to use a personal Makefile in docs/Makefile
      html:
        - cd docs && make html BUILDDIR="$READTHEDOCS_OUTPUT"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
