# rules for gitlab build doc
# based on the file .readthedocs.yaml

create-pages:
  stage: deploy
  tags:  # see https://gitlab.inria.fr/rrichard/mendevi/-/settings/ci_cd#js-runners-settings
    - linux
    - ci.inria.fr
    - large  # or large_more_disk
  image: python:3.14
  script:
    - apt-get update && apt-get install -y graphviz  # to compile images
    - pip install uv
    - uv pip install --system -r docs/requirements.txt
    - uv pip install --system -e .  # solve torch cuda .so link
    - cd docs && make html BUILDDIR=build
  pages:
    publish: docs/build/html  # folder to be exposed
    path_prefix: "$CI_COMMIT_TAG"  # empty on the default branch
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
